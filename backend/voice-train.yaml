pretrained_path: voxcpm/models/voxcpm2
train_manifest: voice-data/train.jsonl
val_manifest: voice-data/validation.jsonl
sample_rate: 16000
out_sample_rate: 48000
batch_size: 1
grad_accum_steps: 2
num_workers: 0
preprocessing_num_workers: 1
num_iters: 120
max_steps: 120
log_interval: 5
valid_interval: 40
save_interval: 40
learning_rate: 8.0e-05
weight_decay: 0.01
warmup_steps: 12
max_batch_tokens: 1800
max_grad_norm: 1.0
save_path: voice-checkpoints
tensorboard: voice-tensorboard
lambdas:
  loss/diff: 1.0
  loss/stop: 1.0
lora:
  enable_lm: true
  enable_dit: true
  enable_proj: false
  r: 32
  alpha: 32
  dropout: 0.0
